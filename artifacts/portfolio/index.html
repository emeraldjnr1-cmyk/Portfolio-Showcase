<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E7E1" />
    <!--seo:start: scripts/prerender.mjs replaces this block per page, from src/seo/pages.ts -->
    <title>Claude Code Developer &amp; AI Automation Expert | Denver NoCode</title>
    <meta name="description" content="Denver Emerald Peter builds apps, websites, AI agents, MCP servers and automations with Claude Code, n8n and Make.com." />
    <link rel="canonical" href="https://www.denvernocode.com/" />
    <!--seo:end-->
    <meta name="google-site-verification" content="Gz8grSSRQ53Y9Z2sF0YL5fsA00-vFSHfljdsSosyTVI" />
    <meta name="msvalidate.01" content="E6525D19C28CEDA8EF304A025E6C67E9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The font stylesheet loads without holding the first paint: the page
         shows at once in the fallback face, then swaps (display=swap). -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500..700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"></noscript>
    <!-- Restores the "Animations off" switch before first paint. Nothing here
         covers or delays the page: the content is in the HTML and shows at once. -->
    <script>
      try {
        document.documentElement.dataset.motion = localStorage.getItem("dnc-motion") === "off" ? "off" : "on";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
